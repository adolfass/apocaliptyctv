<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ретро-ТВ Лендинг</title>
    <link rel="icon" type="image/webp" href="favicon.webp">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-container">
        <!-- Основной контейнер с фоном -->
        <div class="backstage-container" id="backstageContainer">
            <!-- Фоновое изображение -->
            <img src="source/backstage.jpeg" alt="Фон" class="backstage-image" id="backstageImage">
            
            <!-- Интерактивные области на фоне -->
            <div class="imgmap_css_container" id="imgmap202636144235">
                <!-- Область телевизора (alt="1") -->
                <a class="interactive-area area-tv" data-area="tv" href="#tv">
                    <!-- Телевизор будет вставлен сюда через JS -->
                </a>
                
                <!-- Область игрушки (alt="2") -->
                <a class="interactive-area area-toy" data-area="toy" href="#toy">
                    <img src="source/cipan_1.png" alt="Игрушка" class="toy-image" id="toyImage">
                </a>
                
                <!-- Область джойстика (alt="3") -->
                <a class="interactive-area area-joystick" data-area="joystick" href="https://t.me/goldentarot_bot/tarot_app" target="_blank" rel="noopener" data-tooltip="Игровая зона" data-tooltip-desc="Здесь будут мини-игры">
                    <img src="source/djoystick.png" alt="Джойстик" class="static-item">
                </a>
                
                <!-- Область картриджа (alt="4") -->
                <a class="interactive-area area-cartridge" data-area="cartridge" href="#portfolio" data-tooltip="ПОРТФОЛИО">
                    <img src="source/catridge.png" alt="Картридж" class="static-item">
                </a>
                
                <!-- Область приставки (alt="5") -->
                <a class="interactive-area area-console" data-area="console" href="#console" data-tooltip="Консоль настроек" data-tooltip-desc="Скоро будет доступно">
                    <img src="source/console.png" alt="Приставка" class="static-item">
                </a>
            </div>
        </div>
        
        <!-- Футер -->
        <footer class="page-footer">
            <div class="footer-content">
                <div class="footer-links">
                    <a href="https://github.com/adolfass?tab=repositories" target="_blank" rel="noopener" class="footer-link">
                        <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                        <span>GitHub</span>
                    </a>
                    <a href="https://spb.hh.ru/profile/me?hhtmFrom=ProfileActivator" target="_blank" rel="noopener" class="footer-link">
                        <svg class="footer-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm2 2h2v2H8V8zm0 4h2v2H8v-2zm0 4h2v2H8v-2zm4-8h2v2h-2V8zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2zm4-8h2v2h-2V8zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2z"/>
                        </svg>
                        <span>HeadHunter</span>
                    </a>
                </div>
                <div class="footer-buttons">
                    <a href="#payment" class="footer-btn btn-payment">Оплата подписки</a>
                    <a href="#terms" class="footer-btn btn-terms">Условия</a>
                </div>
            </div>
        </footer>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
